<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | REBELWEAR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="/rebelwear.jpg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 61, 0, 0.15);
      border: 1px solid rgba(255, 61, 0, 0.4);
      color: #ff3d00;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(48px, 10vw, 96px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff, #888888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      margin-bottom: 16px;
      color: #e5e5e5;
    }
    p {
      color: #999999;
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #ff3d00;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 61, 0, 0.35);
    }
    .btn-primary:hover {
      background: #e03600;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="badge">Error 404</div>
  <h1>404</h1>
  <h2>This Route Doesn't Exist</h2>
  <p>The page you are looking for may have been moved, renamed, or temporarily unavailable. Jump back to explore our collections.</p>
  <div class="links">
    <a href="/" class="btn btn-primary">Return to Home</a>
    <a href="/streetwear" class="btn btn-secondary">Streetwear</a>
    <a href="/uniforms" class="btn btn-secondary">Team Uniforms</a>
    <a href="/hoodies" class="btn btn-secondary">Hoodies</a>
  </div>
</body>
</html>
